[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcsolver"
version = "1.0.0"
description = "Neuro-symbolic program-synthesis solver for the ARC Prize 2026"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["arcsolver"]
